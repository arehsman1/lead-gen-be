# CalebReview — nginx reverse proxy
#
# Two server blocks: the dashboard on your main domain, the API on a
# subdomain. Adjust server_name to match your actual domains, then run
# certbot (see DEPLOYMENT.md) to auto-upgrade both to HTTPS.
#
# Install: sudo cp caleb-review.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/caleb-review.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# Frontend — app.calebreview.com (or your root domain)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.calebreview.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------------------------------------------------------------------------
# Backend API — api.calebreview.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.calebreview.com;

    # PDF generation and audit runs (live website fetch) can take a while —
    # give them more room than nginx's default 60s before treating it as a
    # dead connection.
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
